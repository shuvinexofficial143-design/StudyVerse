name: StudyVerse Validation (Manual APK)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: studyverse-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project scaffolding
        run: flutter create . --platforms android --org com.studyverse.app
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build Android APK (manual only)
        if: github.event_name == 'workflow_dispatch'
        env:
          STUDYVERSE_SUPABASE_URL: ${{ vars.STUDYVERSE_SUPABASE_URL }}
          STUDYVERSE_SUPABASE_ANON_KEY: ${{ secrets.STUDYVERSE_SUPABASE_ANON_KEY }}
          STUDYVERSE_APPWRITE_ENDPOINT: ${{ vars.STUDYVERSE_APPWRITE_ENDPOINT }}
          STUDYVERSE_APPWRITE_PROJECT_ID: ${{ vars.STUDYVERSE_APPWRITE_PROJECT_ID }}
          STUDYVERSE_APPWRITE_DATABASE_ID: ${{ vars.STUDYVERSE_APPWRITE_DATABASE_ID }}
          STUDYVERSE_APPWRITE_CHAT_TABLE_ID: ${{ vars.STUDYVERSE_APPWRITE_CHAT_TABLE_ID }}
          STUDYVERSE_APPWRITE_MEDIA_BUCKET_ID: ${{ vars.STUDYVERSE_APPWRITE_MEDIA_BUCKET_ID }}
          STUDYVERSE_APPWRITE_PRIVATE_TEAM_ID: ${{ vars.STUDYVERSE_APPWRITE_PRIVATE_TEAM_ID }}
        run: |
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$STUDYVERSE_SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$STUDYVERSE_SUPABASE_ANON_KEY" \
            --dart-define="APPWRITE_ENDPOINT=$STUDYVERSE_APPWRITE_ENDPOINT" \
            --dart-define="APPWRITE_PROJECT_ID=$STUDYVERSE_APPWRITE_PROJECT_ID" \
            --dart-define="APPWRITE_DATABASE_ID=$STUDYVERSE_APPWRITE_DATABASE_ID" \
            --dart-define="APPWRITE_CHAT_TABLE_ID=$STUDYVERSE_APPWRITE_CHAT_TABLE_ID" \
            --dart-define="APPWRITE_MEDIA_BUCKET_ID=$STUDYVERSE_APPWRITE_MEDIA_BUCKET_ID" \
            --dart-define="APPWRITE_PRIVATE_TEAM_ID=$STUDYVERSE_APPWRITE_PRIVATE_TEAM_ID"
      - name: Upload APK (manual only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: StudyVerse-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
