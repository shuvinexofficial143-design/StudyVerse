name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: studyverse-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project scaffolding
        run: flutter create . --platforms android --org com.studyverse.app
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build Android APK
        env:
          STUDYVERSE_SUPABASE_URL: ${{ vars.STUDYVERSE_SUPABASE_URL }}
          STUDYVERSE_SUPABASE_ANON_KEY: ${{ secrets.STUDYVERSE_SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define="SUPABASE_URL=$STUDYVERSE_SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$STUDYVERSE_SUPABASE_ANON_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyVerse-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
