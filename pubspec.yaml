name: studyverse
description: A study-first Android app with quizzes, notes and a private space.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.1
  image_picker: ^1.2.4
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
